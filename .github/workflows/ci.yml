name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Verify
        run: deno task verify

      # Build-only validation: no registry credentials, publishing, or host socket.
      - name: Build discovery helper
        run: docker build -f deploy/discovery/Dockerfile -t librarian-discovery-ci .

      - name: Test packaged Unix socket transport
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m
          --mount "type=bind,source=${{ github.workspace }},target=/workspace,readonly"
          --workdir /workspace --entrypoint deno librarian-discovery-ci
          test --no-config --allow-all backend/src/features/settings/discoveryTransport_test.ts
