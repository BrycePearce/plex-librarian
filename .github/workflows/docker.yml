name: Build and push Docker image

on:
  # Manual runs validate only; they never publish images.
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

env:
  GHCR_IMAGE: ghcr.io/brycepearce/plex-librarian
  DOCKERHUB_IMAGE: docker.io/edon231/plex-librarian

jobs:
  # Validate this exact push/tag before app images receive registry credentials.
  # The separate PR/main CI workflow is not a dependency of a release-tag run.
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.7

      - name: Verify
        run: deno task verify

      - name: Build app image
        run: docker build -t librarian-release-check .

      - name: Confirm native image architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(docker image inspect librarian-release-check --format '{{.Architecture}}')" = "$EXPECTED_ARCHITECTURE"

  build:
    if: github.event_name != 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            suffix: ""
            dockerfile: Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - image: app
            suffix: ""
            dockerfile: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GHCR_IMAGE: ghcr.io/brycepearce/plex-librarian${{ matrix.suffix }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Set platform tag
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    strategy:
      matrix:
        include:
          - image: app
            suffix: ""
    runs-on: ubuntu-latest
    needs: build
    env:
      GHCR_IMAGE: ghcr.io/brycepearce/plex-librarian${{ matrix.suffix }}
      DOCKERHUB_IMAGE: docker.io/edon231/plex-librarian${{ matrix.suffix }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Publish commit index and prepare release tags
        working-directory: /tmp/digests
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          digest_files=(*)
          if (( ${#digest_files[@]} == 0 )); then
            echo "No platform digests were downloaded" >&2
            exit 1
          fi

          sources=()
          for digest in "${digest_files[@]}"; do
            sources+=("${GHCR_IMAGE}@sha256:${digest}")
          done

          ghcr_tags=(-t "${GHCR_IMAGE}:${COMMIT_SHA}")
          dockerhub_tags=(-t "${DOCKERHUB_IMAGE}:${COMMIT_SHA}")
          if [[ "${REF_TYPE}" == "tag" ]]; then
            version="${REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Release tag must match vMAJOR.MINOR.PATCH or a prerelease such as v1.2.3-beta.1" >&2
              exit 1
            fi

            ghcr_tags+=(-t "${GHCR_IMAGE}:${version}")
            dockerhub_tags+=(-t "${DOCKERHUB_IMAGE}:${version}")
            if [[ "${version}" != *-* ]]; then
              major="${version%%.*}"
              remainder="${version#*.}"
              minor="${remainder%%.*}"
              ghcr_tags+=(
                -t "${GHCR_IMAGE}:${major}.${minor}"
                -t "${GHCR_IMAGE}:${major}"
                -t "${GHCR_IMAGE}:latest"
              )
              dockerhub_tags+=(
                -t "${DOCKERHUB_IMAGE}:${major}.${minor}"
                -t "${DOCKERHUB_IMAGE}:${major}"
                -t "${DOCKERHUB_IMAGE}:latest"
              )
            fi
          else
            ghcr_tags+=(-t "${GHCR_IMAGE}:edge")
            dockerhub_tags+=(-t "${DOCKERHUB_IMAGE}:edge")
          fi

          printf '%s\0' "${ghcr_tags[@]}" > "$RUNNER_TEMP/ghcr-tags"
          printf '%s\0' "${dockerhub_tags[@]}" > "$RUNNER_TEMP/dockerhub-tags"
          docker buildx imagetools create -t "${GHCR_IMAGE}:${COMMIT_SHA}" "${sources[@]}"
          docker buildx imagetools create \
            -t "${DOCKERHUB_IMAGE}:${COMMIT_SHA}" \
            "${GHCR_IMAGE}:${COMMIT_SHA}"

      - name: Inspect images
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Resolve and compare published index digests
        id: release-digest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          digest=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${COMMIT_SHA}" --format '{{.Manifest.Digest}}')
          mirror=$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${COMMIT_SHA}" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$digest" = "$mirror"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign GHCR image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.release-digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign Docker Hub image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.release-digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify signed image provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIGEST: ${{ steps.release-digest.outputs.digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            gh attestation verify "oci://${image}@${RELEASE_DIGEST}" \
              --bundle-from-oci --repo "$SOURCE_REPOSITORY" \
              --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/docker.yml" \
              --source-digest "$COMMIT_SHA"
          done

      - name: Promote verified release tags
        env:
          RELEASE_DIGEST: ${{ steps.release-digest.outputs.digest }}
        run: |
          mapfile -d '' -t ghcr_tags < "$RUNNER_TEMP/ghcr-tags"
          mapfile -d '' -t dockerhub_tags < "$RUNNER_TEMP/dockerhub-tags"
          docker buildx imagetools create "${ghcr_tags[@]}" "${GHCR_IMAGE}@${RELEASE_DIGEST}"
          docker buildx imagetools create "${dockerhub_tags[@]}" "${DOCKERHUB_IMAGE}@${RELEASE_DIGEST}"
